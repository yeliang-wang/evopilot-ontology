name: Independent v0.9 source artifact preparation
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact Ontology source commit (40 lowercase hex)
        required: true
        type: string
      source_run_id:
        description: Successful own-repository ci.yml run ID
        required: true
        type: string
      expected_digest:
        description: SHA256 of the exact v0.9.0 package tarball
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: ontology-v0.9-source-preparation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      EXPECTED_DIGEST: ${{ inputs.expected_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: Verify original independent source CI artifact without rebuilding
        run: node scripts/prepare-release-v090.mjs "$RUNNER_TEMP/ontology-release-source"
      - name: Retain verified source preparation (no publication authority)
        uses: actions/upload-artifact@v4
        with:
          name: ontology-v090-source-prepared-${{ inputs.expected_commit }}
          path: ${{ runner.temp }}/ontology-release-source/assets/
          if-no-files-found: error
          retention-days: 14
      - name: Retain acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ontology-v090-source-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/ontology-release-source/evidence/
          if-no-files-found: warn
          retention-days: 14
