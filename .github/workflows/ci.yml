name: Source checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare locked npm metadata for offline installation tests
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {spawnSync} from 'node:child_process';
          const lock=JSON.parse(readFileSync('package-lock.json','utf8'));
          const specs=Object.entries(lock.packages)
            .filter(([path,pkg])=>path&&!pkg.dev)
            .map(([path,pkg])=>path.split('node_modules/').at(-1)+'@'+pkg.version);
          // npm ci caches locked tarballs, but fresh offline installs also need
          // registry metadata. Fetch it before the unchanged offline tests.
          const result=spawnSync('npm',['cache','add',...specs,'--ignore-scripts'],{stdio:'inherit',timeout:300000});
          if(result.error)throw result.error;
          process.exit(result.status??1);
          JS
      - run: npm run build
      - run: npm run check
      - name: Verify frozen governance and review-gate refusal paths
        run: |
          node scripts/roadmap.mjs --check
          npm run test:governance
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21.0.2+13'
          architecture: aarch64
      - name: Prepare locked source-test validators
        shell: bash
        run: |
          set -euo pipefail
          node -e "if(process.platform !== 'darwin' || process.arch !== 'arm64') process.exit(1)"
          node scripts/prepare-ci-toolchains-v090.mjs "$RUNNER_TEMP/ontology-ci-tools" "$JAVA_HOME"
      - name: Run source regression checks with bounded concurrency
        run: node --test --test-concurrency=2 tests/e2e/*.test.mjs

      - name: Pack exact candidate (not a Release)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/pack-candidate-v090.mjs "$RUNNER_TEMP/evopilot-package"
      - name: Retain independently built candidate package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-package
          path: ${{ runner.temp }}/evopilot-package/
          if-no-files-found: error
          retention-days: 14
